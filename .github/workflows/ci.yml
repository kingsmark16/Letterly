name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Next type generation and builds run with production semantics.
      API_ORIGIN: http://localhost:3001

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @letterly/database generate

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Build
        run: pnpm build
      - name: API unit tests
        run: pnpm --filter api test

      - name: API e2e tests
        env:
          NODE_ENV: test
          APP_ORIGIN: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3001
          BETTER_AUTH_SECRET: ci-only-secret-do-not-use-in-production-123456
          DATABASE_URL: postgresql://letterly:letterly@localhost:5432/letterly_test?schema=public
        run: pnpm --filter api test:e2e
