name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: letterly_test
          POSTGRES_USER: letterly
          POSTGRES_PASSWORD: letterly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U letterly -d letterly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Next type generation and builds run with production semantics.
      API_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://letterly:letterly@localhost:5432/letterly_test?schema=public

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @letterly/database generate

      - name: Prepare isolated test database
        run: |
          pnpm --filter @letterly/database exec prisma migrate deploy
          pnpm --filter @letterly/database seed

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Build
        run: pnpm build
      - name: API unit tests
        run: pnpm --filter api test

      - name: API e2e tests
        env:
          NODE_ENV: test
          APP_ORIGIN: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3001
          BETTER_AUTH_SECRET: ci-only-secret-do-not-use-in-production-123456
          DATABASE_URL: postgresql://letterly:letterly@localhost:5432/letterly_test?schema=public
          RUN_REAL_DB_TESTS: "1"
        run: pnpm --filter api test:e2e

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Web Playwright smoke tests
        env:
          NODE_ENV: test
          APP_ORIGIN: http://127.0.0.1:3100
          API_ORIGIN: http://127.0.0.1:3001
          BETTER_AUTH_URL: http://127.0.0.1:3001
          BETTER_AUTH_SECRET: ci-only-secret-do-not-use-in-production-123456
          PUBLIC_MEDIA_PROXY_SECRET: ci-only-proxy-secret-12345678901234567890
          DATABASE_URL: postgresql://letterly:letterly@localhost:5432/letterly_test?schema=public
        run: pnpm --filter web test:e2e e2e/authenticated-draft-loop.spec.ts
