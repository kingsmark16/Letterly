packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - "build"
  - "generate"

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "caniuse-lite@1.0.30001807"
  - "readdirp@5.1.1"
  - "@vercel/backends@18.0.1"
  - "@vercel/build-utils@14.20.1"
  - "@vercel/cervel@0.1.79"
  - "@vercel/container@18.0.1"
  - "@vercel/detect-agent@1.2.6"
  - "@vercel/elysia@18.0.1"
  - "@vercel/express@18.0.1"
  - "@vercel/fastify@18.0.1"
  - "@vercel/gatsby-plugin-vercel-builder@2.2.71"
  - "@vercel/go@21.0.1"
  - "@vercel/h3@18.0.1"
  - "@vercel/hono@18.0.1"
  - "@vercel/hydrogen@19.0.1"
  - "@vercel/koa@18.0.1"
  - "@vercel/nestjs@18.0.1"
  - "@vercel/next@22.0.1"
  - "@vercel/node@23.0.1"
  - "@vercel/python@24.0.1"
  - "@vercel/redwood@20.0.1"
  - "@vercel/remix-builder@23.0.1"
  - "@vercel/ruby@20.0.1"
  - "@vercel/rust@19.0.1"
  - "@vercel/static-build@20.0.1"
  - "@vercel/vc-native-darwin-arm64@63.1.2"
  - "@vercel/vc-native-darwin-x64@63.1.2"
  - "@vercel/vc-native-linux-arm64@63.1.2"
  - "@vercel/vc-native-linux-x64@63.1.2"
  - "@vercel/vc-native-win32-arm64@63.1.2"
  - "@vercel/vc-native-win32-x64@63.1.2"
  - vercel@63.1.2
